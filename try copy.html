<!doctype html>
<html lang="en">

<head>
    <!-- REQUIRED META TAGS -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Kiwiform</title>
    <!--- MAIN CSS ---->
    <link rel="stylesheet" href="assets/css/input.css">
    <link rel="stylesheet" href="assets/css/output.css">
</head>

<body x-data="setup()" class="md:overflow-hidden bg-Theme-bg font-Inter">
    <div class="flex flex-col max-md:gap-8 md:flex-row bg-black-0a0a0a">
        <!--Header--->

        <!--SideBar-->
        <div class="relative flex md:h-full gap-5 md:overflow-hidden">
            <aside
                class="fixed top-[61px] h-[calc(100vh-61px)] pl-px overflow-y-auto scrollbar-hide z-50 flex flex-col bg-black-1B1B1B nav-list rounded-xl transition-all duration-300"
                :class="isSidebarOpen ? 'w-[280px]' : 'w-[80px]'">

                <div class="flex flex-col w-full h-full">
                    <div class="bg-[#F6F6F6] w-full px-[5px] pb-2.5 h-full rounded-b-[10px]">
                        <div
                            class="py-5 flex items-center justify-between w-full px-[15px] border-b border-[#E2DCDC] text-base leading-[140%] font-medium text-Theme-Black">
                            <span :class="{'hidden':!isSidebarOpen, 'block':isSidebarOpen}">Workspaces</span>
                            <button @click="toggleSidbarMenu()" class="block md:hidden">
                                <svg width="24" height="24" fill="none" stroke="#007D47" stroke-width="2"
                                    viewBox="0 0 24 24">
                                    <path d="M3 6h18M3 12h18M3 18h18" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Sidebar content here -->
                    <div class="flex-1 p-2">
                        <p :class="isSidebarOpen ? 'opacity-100' : 'opacity-0 transition-opacity duration-300'">
                            Sidebar content
                        </p>
                    </div>
                </div>
            </aside>

        </div>
        <div
            class="xl:w-[calc(100%-321px)] lg:w-[calc(100%-281px)] w-[calc(100%-281px)] ml-auto relative md:h-screen md:overflow-y-hidden pt-[29px] md:pt-[61px]">
            <!--Main Content Page-->
            <div class="w-full h-full relative bg-[#F6F6F6] rounded-10px px-[5px] py-2.5">

            </div>
        </div>
    </div>
    <!-- MAIN JS-->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('dropdown', {
                openId: null,
            });
        });
    </script>
    <script>
        function setup() {
            function getSidebarStateFromLocalStorage() {
                const savedState = window.localStorage.getItem("isSidebarOpen");

                // If user has already toggled before → use saved state
                if (savedState !== null) {
                    return JSON.parse(savedState);
                }

                // Default behavior: open on desktop, closed on mobile
                return window.innerWidth >= 768;
            }

            function setSidebarStateToLocalStorage(value) {
                window.localStorage.setItem("isSidebarOpen", value);
            }

            return {
                isSidebarOpen: getSidebarStateFromLocalStorage(),

                toggleSidbarMenu() {
                    this.isSidebarOpen = !this.isSidebarOpen;
                    setSidebarStateToLocalStorage(this.isSidebarOpen);
                },

                // Optional: dynamically adjust on resize
                handleResize() {
                    if (window.innerWidth >= 768 && this.isSidebarOpen === false) {
                        this.isSidebarOpen = true;
                    } else if (window.innerWidth < 768 && this.isSidebarOpen === true) {
                        this.isSidebarOpen = false;
                    }
                },

                init() {
                    window.addEventListener('resize', () => this.handleResize());
                }
            };
        }
    </script>

    <script>
        // navbar search box functionality
        const searchInput = document.querySelector('.search-input');
        const searchIcon = document.querySelector('.search-icon');
        const clearBtn = document.querySelector('.clear-btn');

        // When input is focused
        searchInput.addEventListener('focus', () => {
            searchIcon.querySelectorAll('path').forEach(p => p.setAttribute('stroke', '#007D47')); // Theme Green
        });

        // When input loses focus
        searchInput.addEventListener('blur', () => {
            searchIcon.querySelectorAll('path').forEach(p => p.setAttribute('stroke', '#8C8484'));
        });

        // Show or hide clear button depending on input value
        searchInput.addEventListener('input', () => {
            clearBtn.classList.toggle('hidden', searchInput.value === '');
        });

        // Clear input when clear button is clicked
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            searchInput.focus();
        });
    </script>
</body>

</html>
