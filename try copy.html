<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Single Tag Input</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 bg-gray-50">

  <div class="max-w-md">
    <label class="block text-sm font-medium text-gray-700 mb-1">Tag As</label>
    <div id="tagInputWrapper"
      class="flex flex-wrap items-center gap-2 p-2 border border-gray-200 rounded-md bg-gray-50 focus-within:border-gray-400 transition-all">
      <input id="tagInput" type="text" placeholder="Add tag"
        class="flex-1 bg-transparent border-none focus:ring-0 outline-none text-sm text-gray-700 min-w-[80px]" />
    </div>
  </div>

  <script>
    const wrapper = document.getElementById('tagInputWrapper');
    const input = document.getElementById('tagInput');

    // Store single tag
    let tags = ['High']; // default tag

    function renderTags() {
      wrapper.querySelectorAll('.tag').forEach(tag => tag.remove());

      tags.forEach(tagText => {
        const tagEl = document.createElement('div');
        tagEl.className =
          'tag flex items-center gap-1 px-2 py-1 bg-white border border-gray-200 rounded-full text-sm text-green-700 font-medium';
        tagEl.innerHTML = `
          <span>${tagText}</span>
          <button type="button" class="text-gray-500 hover:text-gray-700 focus:outline-none" data-tag="${tagText}">
            &times;
          </button>
        `;
        wrapper.insertBefore(tagEl, input);
      });

      // Hide input if max tag (1) reached
      input.style.display = tags.length >= 1 ? 'none' : 'block';
    }

    function addTag(value) {
      const trimmed = value.trim();
      if (trimmed) {
        tags = [trimmed]; // replace existing tag
        renderTags();
      }
      input.value = '';
    }

    function removeTag(tagText) {
      tags = tags.filter(t => t !== tagText);
      renderTags();
    }

    // Add tag on Enter
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addTag(input.value);
      }
    });

    // Add tag on blur
    input.addEventListener('blur', () => {
      addTag(input.value);
    });

    // Remove tag on click
    wrapper.addEventListener('click', e => {
      if (e.target.matches('button[data-tag]')) {
        removeTag(e.target.dataset.tag);
      }
    });

    // Initialize default tag
    renderTags();
  </script>

</body>
</html>
