  <!-- === DESIGN 3 === -->

                    <path d="M12 6L15 6" stroke="#007D47" stroke-width="1.5" stroke-linecap="round"

                    <path d="M12 16L15 16" stroke="#000A06" stroke-width="1.5" stroke-linecap="round"

            <li

              <span

              <p class="flex items-center gap-2.5 text-[15px] leading-[120%] font-normal text-Theme-Black">
                Choice 2
              </p>
              <svg class="absolute top-[11px] right-[11px] opacity-0 transition-opacity" width="18" height="18"
                viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="18" height="18" rx="9" fill="#007D47" />
                <path d="M5.25 8.71875L7.75 11.2188L12.75 6.21875" stroke="white" stroke-width="1.2"

          <!-- Group 2 -->
          <ul class="dropdown-list flex flex-col gap-[5px] pb-[15px] border-b border-[#E2DCDC] mb-[15px]" data-group="2">
            <li class="flex items-center justify-between pb-[5px]">
              <div class="flex items-center gap-[15px]">
                <div class="w-10 aspect-square rounded-[10px] flex items-center justify-center bg-[#F2EFEF]">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="10" cy="10" r="9" fill="#CAEADC" stroke="#007D47" stroke-width="1.5"
                      stroke-linejoin="round" />
                    <path d="M14 8L10 12L6 8" stroke="#000A06" stroke-width="1.5" stroke-linecap="round"
                      stroke-linejoin="round" />
                  </svg>
                </div>

              </div>
              <span

            </li>
            <li
              class="dropdown-item flex items-center gap-[15px] relative cursor-pointer rounded-[8px] px-3 py-2 bg-[#F8F6F6] hover:bg-[#EBF8F2]"
              data-index="2" data-label="A">
              <span
                class="index w-5 aspect-square rounded-full flex items-center justify-center bg-[#E8E1E1] text-xs font-semibold text-Theme-Black">A</span>
              <p class="flex items-center gap-2.5 text-[15px] leading-[120%] font-normal text-Theme-Black">
                Choice 1
              </p>
              <svg class="absolute top-[11px] right-[11px] opacity-0 transition-opacity" width="18" height="18"
                viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="18" height="18" rx="9" fill="#007D47" />
                <path d="M5.25 8.71875L7.75 11.2188L12.75 6.21875" stroke="white" stroke-width="1.2"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </li>
            <li
              class="dropdown-item flex items-center gap-[15px] relative cursor-pointer rounded-[8px] px-3 py-2 bg-[#F8F6F6] hover:bg-[#EBF8F2]"
              data-index="2" data-label="B">
              <span
                class="index w-5 aspect-square rounded-full flex items-center justify-center bg-[#E8E1E1] text-xs font-semibold text-Theme-Black">B</span>
              <p class="flex items-center gap-2.5 text-[15px] leading-[120%] font-normal text-Theme-Black">
                Choice 1
              </p>
              <svg class="absolute top-[11px] right-[11px] opacity-0 transition-opacity" width="18" height="18"
                viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="18" height="18" rx="9" fill="#007D47" />
                <path d="M5.25 8.71875L7.75 11.2188L12.75 6.21875" stroke="white" stroke-width="1.2"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </li>
          </ul>

          <!-- Group 3 -->
          <ul class="dropdown-list flex flex-col gap-1" data-group="3">
            <li class="flex items-center justify-between pb-[5px]">
              <div class="flex items-center gap-[15px]">
                <div class="w-10 aspect-square rounded-[10px] flex items-center justify-center bg-[#F2EFEF]">
                  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1" y="1" width="18" height="18" rx="2" fill="#CAEADC" stroke="#007D47"
                      stroke-width="1.5" />
                    <circle cx="11" cy="6" r="2" stroke="#000A06" stroke-width="1.5" stroke-linejoin="round" />
                    <path d="M10 15L14.8777 10L19.0001 14" stroke="#007D47" stroke-width="1.5" stroke-linecap="round"
                      stroke-linejoin="round" />
                    <path d="M1 18L8 11L11 14" stroke="#007D47" stroke-width="1.5" stroke-linejoin="round" />
                  </svg>
                </div>
                <h4 class="text-base font-medium leading-140 text-Theme-Black">Picture Selection
                </h4>
              </div>
              <span
                class="w-[30px] aspect-square rounded-full text-[15px] leading-6 bg-[#EBF8F2] text-[#007D47] flex items-center justify-center">3</span>
            </li>
            <li
              class="dropdown-item flex items-center gap-[15px] relative cursor-pointer rounded-[8px] px-3 py-2 bg-[#F8F6F6] hover:bg-[#EBF8F2]"
              data-index="3" data-label="A">
              <span
                class="index w-5 aspect-square rounded-full flex items-center justify-center bg-[#E8E1E1] text-xs font-semibold text-Theme-Black">A</span>
              <p class="flex items-center gap-2.5 text-[15px] leading-[120%] font-normal text-Theme-Black">
                Choice 1
              </p>
              <svg class="absolute top-[11px] right-[11px] opacity-0 transition-opacity" width="18" height="18"
                viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="18" height="18" rx="9" fill="#007D47" />
                <path d="M5.25 8.71875L7.75 11.2188L12.75 6.21875" stroke="white" stroke-width="1.2"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </li>
            <li
              class="dropdown-item flex items-center gap-[15px] relative cursor-pointer rounded-[8px] px-3 py-2 bg-[#F8F6F6] hover:bg-[#EBF8F2]"
              data-index="3" data-label="B">
              <span
                class="index w-5 aspect-square rounded-full flex items-center justify-center bg-[#E8E1E1] text-xs font-semibold text-Theme-Black">B</span>
              <p class="flex items-center gap-2.5 text-[15px] leading-[120%] font-normal text-Theme-Black">
                Choice 1
              </p>
              <svg class="absolute top-[11px] right-[11px] opacity-0 transition-opacity" width="18" height="18"
                viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="18" height="18" rx="9" fill="#007D47" />
                <path d="M5.25 8.71875L7.75 11.2188L12.75 6.21875" stroke="white" stroke-width="1.2"
                  stroke-linecap="round" stroke-linejoin="round" />

            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.custom-dropdown[data-style="design3"]').forEach(dropdown => {
      const button = dropdown.querySelector('.dropdown-button');
      const menu = dropdown.querySelector('.dropdown-menu');
      const arrow = dropdown.querySelector('.dropdown-arrow');
      const selectedContainer = dropdown.querySelector('.selected-option');
      const placeholder = selectedContainer.querySelector('.placeholder');
      const items = dropdown.querySelectorAll('.dropdown-item');
      const selectedItems = new Map(); // key = group|label, value = { group, index, label }

      // --- Toggle dropdown open/close
      button.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('hidden');
        arrow.classList.toggle('rotate-180');
      });

      // --- Close when clicking outside
      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target)) {
          menu.classList.add('hidden');
          arrow.classList.remove('rotate-180');
        }
      });

      // --- Handle item selection
      items.forEach(item => {
        const svg = item.querySelector('svg');
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const label = item.dataset.label;
          const group = item.closest('.dropdown-list').dataset.group;
          const index = item.dataset.index;
          const key = `${group}|${label}`;

          const isSelected = selectedItems.has(key);

          if (isSelected) {
            selectedItems.delete(key);

            svg.classList.remove('opacity-100');
            svg.classList.add('opacity-0');
          } else {
            selectedItems.set(key, { group, index, label });

            svg.classList.add('opacity-100');
            svg.classList.remove('opacity-0');
          }

          renderSelected();
        });
      });

      // --- Render selected chips
      function renderSelected() {
        selectedContainer.innerHTML = '';
        const selectedArray = Array.from(selectedItems.values());
        const totalSelected = selectedArray.length;

        if (totalSelected === 0) {
          placeholder.style.display = 'block';
          selectedContainer.appendChild(placeholder);
          return;
        }

        placeholder.style.display = 'none';

        // Show first 2 chips, then "+N" summary if more
        const visibleCount = 3;
        const visibleItems = selectedArray.slice(0, visibleCount);
        const remainingCount = totalSelected - visibleCount;

        visibleItems.forEach((data) => {
          const chip = document.createElement('div');
          chip.className =
            'chip flex items-center gap-1 bg-white rounded-[20px] border border-[#E2DCDC] px-2 py-1';
          chip.innerHTML = `
          <span class="w-[20px] h-[20px] flex items-center justify-center rounded-full bg-[#007D47] text-white text-xs font-semibold">${data.index}</span>
          <span class="text-[#000A06] text-[14px] font-medium">${data.label}</span>
          <button class="remove-chip text-[#8C8484] text-sm leading-none">×</button>
        `;

          // Remove on click
          chip.querySelector('.remove-chip').addEventListener('click', (ev) => {
            ev.stopPropagation();
            const key = `${data.group}|${data.label}`;
            selectedItems.delete(key);

            const item = dropdown.querySelector(`.dropdown-list[data-group="${data.group}"] .dropdown-item[data-label="${data.label}"]`);
            if (item) {

              const svg = item.querySelector('svg');
              if (svg) {
                svg.classList.remove('opacity-100');
                svg.classList.add('opacity-0');
              }
            }

            renderSelected();
          });

          selectedContainer.appendChild(chip);
        });

        // Add "+N" capsule if there are more
        if (remainingCount > 0) {
          const moreChip = document.createElement('div');
          moreChip.className =
            'chip flex items-center justify-center bg-[#F8F6F6] rounded-[20px] border border-[#E2DCDC] px-2 py-1 text-[#8C8484] text-[14px] font-medium';
          moreChip.textContent = `+${remainingCount}`;
          selectedContainer.appendChild(moreChip);
        }
      }
    });
  </script>


</body>
