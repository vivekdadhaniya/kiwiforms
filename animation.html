    <style>
        [x-cloak] {
            display: none !important
        }

        /* ===== BADGE ===== */
        .badgePop {
            animation: badgePop .7s cubic-bezier(.2, .9, .2, 1) forwards;
        }

        @keyframes badgePop {
            from {
                transform: scale(.7);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        .badgeFade {
            animation: badgeFade .6s ease forwards;
        }

        @keyframes badgeFade {
            to {
                opacity: 0;
                transform: scale(.85)
            }
        }

        /* ===== PLANE ===== */
        .planeIn {
            animation: planeIn .6s ease forwards;
        }

        @keyframes planeIn {
            from {
                opacity: 0;
                transform: scale(.7)
            }

            to {
                opacity: 1;
                transform: scale(1)
            }
        }

        .planeFly {
            animation: planeFly 2s cubic-bezier(.25, .8, .25, 1) forwards;
        }

        @keyframes planeFly {

            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }

            25% {
                transform: translate(25px, -15px) rotate(8deg);
                opacity: 1;
            }

            60% {
                transform: translate(100px, -80px) rotate(14deg) scale(.9);
                opacity: 1;
            }

            100% {
                transform: translate(180px, -180px) rotate(20deg) scale(.7);
                opacity: 0;
            }
        }
    </style>
</head>
