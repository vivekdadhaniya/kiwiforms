<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Char limit toggle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="p-6 bg-gray-50">
  <div x-data="charLimitToggle()" class="w-full max-w-md">
    <label class="flex items-center justify-between cursor-pointer w-full">
      <span class="text-base font-medium">Button</span>

      <div class="relative flex items-center">
        <input id="toggle" type="checkbox" class="sr-only" x-model="enabled" />
        <!-- custom switch -->
        <div @click="enabled = !enabled" :class="enabled ? 'bg-green-500' : 'bg-[#EDE9E9]'"
          class="w-11 h-6 rounded-full relative transition-colors cursor-pointer" role="switch"
          :aria-checked="enabled.toString()" tabindex="0" @keydown.enter.prevent="enabled = !enabled"
          @keydown.space.prevent="enabled = !enabled">
          <span :class="enabled ? 'translate-x-[20px]' : 'translate-x-0'"
            class="absolute top-[2px] left-[2px] w-5 h-5 bg-white rounded-full shadow transform transition-transform"></span>

          <!-- small static dot when off -->
          <svg x-show="!enabled" class="absolute top-[6px] left-[6px] w-1 h-1 text-[#E2DCDC]" viewBox="0 0 4 4"
            fill="none">
            <circle cx="2" cy="2" r="2" fill="currentColor"></circle>
          </svg>

          <!-- small vertical bar when on -->
          <svg x-show="enabled" class="absolute top-[9px] right-[8px] w-[2px] h-[6px] text-[#E2DCDC]" viewBox="0 0 2 6"
            fill="none">
            <rect width="2" height="6" rx="1" fill="currentColor"></rect>
          </svg>
        </div>
      </div>
    </label>

    <div class="relative mt-4">
      <input type="text" placeholder="Build a Kiwiform" :disabled="!enabled" x-model="value" @input="onInput"
        :maxlength="maxChars"
        class="w-full bg-[#EDE9E9] py-[13px] px-[15px] rounded-2xl text-sm leading-[100%] placeholder:text-[#8C8484] text-Theme-Black outline-0 focus:outline-0 disabled:opacity-50 disabled:cursor-not-allowed"
        aria-label="Build a Kiwiform">

      <!-- character counter pill -->
      <div class="absolute right-3 bottom-[-28px]">
        <div
          class="px-3 py-1 rounded-full bg-white/60 text-sm leading-5 text-[#8C8484] border border-transparent shadow-sm"
          :class="enabled ? 'bg-white' : 'bg-white/60'">
          <span x-text="currentLength"></span><span class="text-[#8C8484]">/</span><span x-text="maxChars"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    function charLimitToggle() {
      const STORAGE_KEY = 'charLimit';
      const ENABLED_KEY = 'charLimitEnabled';
      const MAX = 24;

      return {
        enabled: localStorage.getItem(ENABLED_KEY) === 'true',
        value: localStorage.getItem(STORAGE_KEY) ?? '',
        maxChars: MAX,

        get currentLength() {
          return (this.value ?? '').length;
        },

        init() {
          // ensure value respects maxlength after load
          if (this.value.length > MAX) {
            this.value = this.value.slice(0, MAX);
            localStorage.setItem(STORAGE_KEY, this.value);
          }
          // If the toggle is disabled but char exists, we still show (but input disabled)
          // save initial enabled state
          localStorage.setItem(ENABLED_KEY, this.enabled);
        },

        onInput(e) {
          // guard: enforce maxlength (in case mobile or older browsers)
          if (this.value.length > MAX) {
            this.value = this.value.slice(0, MAX);
          }
          localStorage.setItem(STORAGE_KEY, this.value);
          localStorage.setItem(ENABLED_KEY, this.enabled);
        }
      };
    }
  </script>
</body>

</html>
