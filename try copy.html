<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-50 space-y-10">

  <!-- Image Upload -->
  <div class="w-[310px] h-[124px] flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg bg-white hover:border-blue-400 transition">
    <label class="flex flex-col items-center cursor-pointer">
      <div class="flex flex-col items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h3.586a1 1 0 01.707.293l1.414 1.414A1 1 0 0011.414 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
        </svg>
        <span class="font-medium text-gray-700">Upload Image</span>
      </div>
      <input type="file" accept="image/*" class="hidden" />
    </label>
  </div>
  <p class="text-gray-500 text-sm text-center">Upload an image here<br>JPG, PNG or GIF • 5MB Max</p>

  <!-- Video Upload -->
  <div class="w-[310px] h-[124px] flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg bg-white hover:border-blue-400 transition">
    <label class="flex flex-col items-center cursor-pointer">
      <div class="flex flex-col items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-500 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553 2.276A1 1 0 0120 13.118V18a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h12a2 2 0 012 2v4.882a1 1 0 01-.447.842L15 14v-4z" />
        </svg>
        <span class="font-medium text-gray-700">Upload Video</span>
      </div>
      <input type="file" accept="video/*" class="hidden" />
    </label>
  </div>
  <p class="text-gray-500 text-sm text-center">Upload a video here<br>Max 5 mins • 500MB Max</p>

</body>
</html>
