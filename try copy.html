<!doctype html>
<html lang="en">
  <head>
    <!-- REQUIRED META TAGS -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Kiwiform/share</title>
    <!--- MAIN CSS ---->
    <link rel="stylesheet" href="assets/css/input.css" />
    <link rel="stylesheet" href="assets/css/output.css" />
    <link rel="stylesheet" href="node_modules/leaflet/dist/leaflet.css" />
    <style></style>
  </head>

  <body class="bg-Theme-bg font-Inter h-screen">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <div x-data="mappingBuilder()" class="max-w-5xl">
      <!-- Rows -->
      <template x-for="(row, index) in rows" :key="row.id">
        <div class="flex items-center gap-3 mb-3">
          <!-- Left Dropdown -->
          <div class="relative flex-1">
            <button
              type="button"
              @click="toggleDropdown(index, 'field')"
              class="w-full h-12 px-4 border border-gray-300 rounded-lg bg-white flex items-center justify-between text-left"
            >
              <span
                x-text="row.field || 'Select a Kiwiform Form Field'"
                class="text-gray-600"
              ></span>

              <svg
                class="w-4 h-4 transition duration-300"
                :class="row.openField ? 'rotate-180' : ''"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>

            <div
              x-show="row.openField"
              x-transition
              @click.outside="row.openField = false"
              class="absolute left-0 top-full mt-2 w-full bg-white border border-gray-200 rounded-lg shadow-lg z-50 overflow-hidden"
            >
              <template x-for="option in fieldOptions" :key="option">
                <div
                  @click="
                                row.field = option;
                                row.openField = false;
                            "
                  class="px-4 py-3 hover:bg-gray-100 cursor-pointer"
                  x-text="option"
                ></div>
              </template>
            </div>
          </div>

          <!-- Right Dropdown -->
          <div class="relative flex-1">
            <button
              type="button"
              @click="toggleDropdown(index, 'property')"
              class="w-full h-12 px-4 border border-gray-300 rounded-lg bg-white flex items-center justify-between text-left"
            >
              <span
                x-text="row.property || 'Select a HubSpot Field to Map'"
                class="text-gray-600"
              ></span>

              <svg
                class="w-4 h-4 transition duration-300"
                :class="row.openProperty ? 'rotate-180' : ''"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>

            <div
              x-show="row.openProperty"
              x-transition
              @click.outside="row.openProperty = false"
              class="absolute left-0 top-full mt-2 w-full bg-white border border-gray-200 rounded-lg shadow-lg z-50 overflow-hidden"
            >
              <template x-for="option in propertyOptions" :key="option">
                <div
                  @click="
                                row.property = option;
                                row.openProperty = false;
                            "
                  class="px-4 py-3 hover:bg-gray-100 cursor-pointer"
                  x-text="option"
                ></div>
              </template>
            </div>
          </div>

          <!-- Delete Button -->
          <button
            @click="removeRow(index)"
            class="w-10 h-10 flex items-center justify-center rounded-full bg-[#F6F6F6] hover:bg-red-50 transition"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M4.75 5.625H15.25V13.5C15.25 15.1499 15.25 15.9749 14.7374 16.4874C14.2249 17 13.3999 17 11.75 17H8.25C6.60008 17 5.77513 17 5.26256 16.4874C4.75 15.9749 4.75 15.1499 4.75 13.5V5.625Z"
                stroke="#000A06"
                stroke-width="1.2"
              />
              <path
                d="M3 5.625H17"
                stroke="#000A06"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M6.5 4.75C6.5 3.92504 6.5 3.51256 6.75628 3.25628C7.01256 3 7.42504 3 8.25 3H11.75C12.575 3 12.9874 3 13.2437 3.25628C13.5 3.51256 13.5 3.92504 13.5 4.75V5.625H6.5V4.75Z"
                stroke="#000A06"
                stroke-width="1.2"
              />
              <path
                d="M8.25 9.125V13.5"
                stroke="#000A06"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M11.75 9.125V13.5"
                stroke="#000A06"
                stroke-width="1.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </template>

      <!-- Bottom Actions -->
      <div class="flex gap-3 mt-4">
        <!-- Add Map Property -->
        <button
          @click="addRow()"
          class="flex-1 h-10 rounded-10px bg-[#F6F6F6] hover:bg-[#EDE9E9] text-sm leading-5 text-Theme-Black transition flex items-center justify-center gap-2.5"
        >
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>

          Add Map Property
        </button>

        <!-- Clear All -->
        <button
          @click="clearAll()"
          class="flex items-center gap-2.5 py-2.5 max-h-10 px-[15px] rounded-10px bg-[#F8F1F1] text-sm leading-5 text-[#DC3027] transition-all duration-500 hover:bg-[#DC3027] hover:text-white"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M4.75 5.625H15.25V13.5C15.25 15.1499 15.25 15.9749 14.7374 16.4874C14.2249 17 13.3999 17 11.75 17H8.25C6.60008 17 5.77513 17 5.26256 16.4874C4.75 15.9749 4.75 15.1499 4.75 13.5V5.625Z"
              stroke="currentColor"
              stroke-width="1.2"
            />
            <path
              d="M3 5.625H17"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M6.5 4.75C6.5 3.92504 6.5 3.51256 6.75628 3.25628C7.01256 3 7.42504 3 8.25 3H11.75C12.575 3 12.9874 3 13.2437 3.25628C13.5 3.51256 13.5 3.92504 13.5 4.75V5.625H6.5V4.75Z"
              stroke="currentColor"
              stroke-width="1.2"
            />
            <path
              d="M8.25 9.125V13.5"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M11.75 9.125V13.5"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Clear All</span>
        </button>
      </div>
    </div>

    <script>
      function mappingBuilder() {
        return {
          fieldOptions: ['Name', 'Email', 'Phone', 'Company'],

          propertyOptions: ['First Name', 'Email Address', 'Phone Number', 'Company Name'],

          rows: [
            {
              id: Date.now(),
              field: '',
              property: '',
              openField: false,
              openProperty: false
            }
          ],

          addRow() {
            this.rows.push({
              id: Date.now() + Math.random(),
              field: '',
              property: '',
              openField: false,
              openProperty: false
            })
          },

          removeRow(index) {
            if (this.rows.length === 1) {
              this.rows[0] = {
                id: Date.now(),
                field: '',
                property: '',
                openField: false,
                openProperty: false
              }
              return
            }

            this.rows.splice(index, 1)
          },

          clearAll() {
            this.rows = [
              {
                id: Date.now(),
                field: '',
                property: '',
                openField: false,
                openProperty: false
              }
            ]
          },

          allRowsCompleted() {
            return this.rows.every((row) => row.field !== '' && row.property !== '')
          },

          toggleDropdown(index, type) {
            this.rows.forEach((row, i) => {
              if (i !== index) {
                row.openField = false
                row.openProperty = false
              }
            })

            if (type === 'field') {
              this.rows[index].openField = !this.rows[index].openField
            }

            if (type === 'property') {
              this.rows[index].openProperty = !this.rows[index].openProperty
            }
          }
        }
      }
    </script>
  </body>
</html>
