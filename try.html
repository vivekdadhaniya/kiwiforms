<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Custom Domains</title>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-10">

    <div x-data="domainManager()" class="max-w-5xl mx-auto bg-white rounded-2xl p-6 shadow">

        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-semibold">Custom Domains</h1>
            <button class="bg-green-600 text-white px-4 py-2 rounded-lg">
                + Add Domain
            </button>
        </div>

        <!-- Domain List -->
        <template x-for="domain in domains" :key="domain.id">
            <div class="border rounded-xl p-4 flex justify-between items-center mb-4">

                <div>
                    <p class="font-medium" x-text="domain.name"></p>
                    <span class="text-xs bg-green-100 text-green-600 px-2 py-1 rounded">
                        Active
                    </span>
                </div>

                <div class="flex gap-3">
                    <!-- Edit -->
                    <button @click="openDialog(domain)" class="p-2 hover:bg-gray-100 rounded-lg">
                        ✏️
                    </button>

                    <!-- Delete -->
                    <button class="p-2 hover:bg-gray-100 rounded-lg">
                        🗑
                    </button>
                </div>

            </div>
        </template>


        <!-- ================= DIALOG ================= -->
        <div x-show="open" x-transition class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">

            <div @click.away="open = false" class="bg-white w-full max-w-4xl rounded-2xl shadow-xl p-6">

                <!-- Header -->
                <div class="flex justify-between items-center border-b pb-4">
                    <div class="flex items-center gap-3">
                        <h2 class="text-lg font-semibold" x-text="activeDomain?.name"></h2>

                        <span class="text-xs px-2 py-1 bg-green-100 text-green-600 rounded-full">
                            Active
                        </span>
                    </div>

                    <button @click="open = false">✕</button>
                </div>

                <!-- Tabs -->
                <div class="flex gap-2 bg-gray-100 rounded-lg p-1 mt-4 w-fit">
                    <button @click="tab='domains'" :class="tab==='domains' ? 'bg-white shadow' : ''"
                        class="px-4 py-1 rounded-md text-sm">
                        Domains
                    </button>

                    <button @click="tab='config'" :class="tab==='config' ? 'bg-white shadow' : ''"
                        class="px-4 py-1 rounded-md text-sm">
                        Configuration
                    </button>
                </div>

                <!-- Content -->
                <div class="mt-6">

                    <!-- Domains Tab -->
                    <div x-show="tab==='domains'">

                        <p class="text-sm text-gray-500 mb-4">
                            Connect your domain to your published forms and use custom URLs.
                        </p>

                        <template x-for="(url, index) in activeDomain.urls" :key="index">
                            <div class="grid grid-cols-3 gap-3 mb-3">

                                <!-- Workspace -->
                                <select class="border rounded-lg p-2 text-sm">
                                    <option>Public Surveys</option>
                                </select>

                                <!-- Form -->
                                <select class="border rounded-lg p-2 text-sm">
                                    <option>Survey Form</option>
                                </select>

                                <!-- URL -->
                                <div class="flex items-center gap-2">
                                    <input type="text" x-model="url.value"
                                        class="border rounded-lg p-2 w-full text-sm" />

                                    <button title="Copy">📋</button>
                                    <button title="Settings">⚙️</button>
                                    <button @click="removeUrl(index)">🗑</button>
                                </div>

                            </div>
                        </template>

                        <!-- Add URL -->
                        <button @click="addUrl()" class="w-full border rounded-lg py-2 mt-2 text-sm hover:bg-gray-50">
                            + Add Custom URL
                        </button>

                    </div>

                    <!-- Configuration Tab -->
                    <div x-show="tab==='config'">
                        <p class="text-sm text-gray-500">
                            Domain configuration settings will go here.
                        </p>
                    </div>

                </div>

                <!-- Footer -->
                <div class="flex justify-center mt-6">
                    <button @click="saveChanges()" class="bg-gray-200 px-6 py-2 rounded-lg hover:bg-gray-300">
                        Save Changes
                    </button>
                </div>

            </div>
        </div>

    </div>


    <!-- ================= SCRIPT ================= -->
    <script>
        function domainManager() {
            return {
                open: false,
                tab: 'domains',

                domains: [
                    {
                        id: 1,
                        name: 'form.customlink.com',
                        urls: [
                            { value: 'form.customlink.com/survey' },
                            { value: 'form.customlink.com/contact' }
                        ]
                    },
                    {
                        id: 2,
                        name: 'form2.customlink.com',
                        urls: [
                            { value: 'form2.customlink.com/demo' }
                        ]
                    }
                ],

                activeDomain: null,

                openDialog(domain) {
                    this.activeDomain = JSON.parse(JSON.stringify(domain)); // clone
                    this.open = true;
                    this.tab = 'domains';
                },

                addUrl() {
                    this.activeDomain.urls.push({ value: '' });
                },

                removeUrl(index) {
                    this.activeDomain.urls.splice(index, 1);
                },

                saveChanges() {
                    const index = this.domains.findIndex(d => d.id === this.activeDomain.id);
                    this.domains[index] = this.activeDomain;
                    this.open = false;
                }
            }
        }
    </script>

</body>

</html>
