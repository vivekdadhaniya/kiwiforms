<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag Input</title>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.3/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="p-10 bg-gray-50">

  <div class="w-full max-w-lg" x-data="tagInput()" @click.outside="convertInputToTag">
    <label class="block text-sm font-medium text-gray-700 mb-1">Tag As</label>

    <div class="flex flex-wrap items-center gap-2 bg-gray-50 border border-gray-200 rounded-md px-3 py-2 min-h-[42px]"
      @click="$refs.input.focus()">

      <!-- Tags -->
      <template x-for="(tag, index) in tags" :key="index">
        <div
          class="flex items-center gap-1 bg-white border border-gray-300 rounded-full px-3 py-1 text-sm text-green-700">
          <span x-text="tag"></span>
          <button type="button" @click="removeTag(index)" class="text-gray-500 hover:text-black">
            &times;
          </button>
        </div>
      </template>

      <!-- Input -->
      <input x-ref="input" type="text" x-model="newTag"
        @keydown.enter.prevent="addTag"
        class="flex-1 bg-transparent focus:outline-none min-w-[80px] text-sm text-gray-700"
        placeholder="Type and press Enter" />
    </div>
  </div>

  <script>
    function tagInput() {
      return {
        tags: ['High'], // default tag
        newTag: '',
        addTag() {
          const value = this.newTag.trim();
          if (value && !this.tags.includes(value)) {
            this.tags.push(value);
          }
          this.newTag = '';
        },
        removeTag(index) {
          this.tags.splice(index, 1);
        },
        convertInputToTag() {
          if (this.newTag.trim()) {
            this.addTag();
          }
        }
      };
    }
  </script>

</body>
</html>
