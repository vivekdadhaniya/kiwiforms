<script>
$(function(){

  let animation;

  $("#publishBtn").on("click", function(){

    if(animation) return; // prevent double click

    // Show overlay
    $(".overlay-modal")
      .removeClass("opacity-0 invisible")
      .addClass("opacity-100 visible");

    // Show animation container
    $("#lottieContainer")
      .removeClass("opacity-0 scale-75")
      .addClass("opacity-100 scale-100");

    animation = lottie.loadAnimation({
      container: document.getElementById("lottieContainer"),
      renderer: "svg",
      loop: false,
      autoplay: true,
      path: "assets/lottie/Success.json"
    });

    animation.setSpeed(0.7);

    animation.addEventListener("complete", function(){

      // Hide animation
      $("#lottieContainer")
        .removeClass("opacity-100 scale-100")
        .addClass("opacity-0 scale-75");

      // Show modal
      setTimeout(function(){
        $("#publish")
          .removeClass("hidden")
          .addClass("flex flex-col");
      }, 300);

    });

  });

  function closeModal(){

    $("#publish")
      .addClass("hidden")
      .removeClass("flex");

    $(".overlay-modal")
      .removeClass("opacity-100 visible")
      .addClass("opacity-0 invisible");

    if(animation){
      animation.destroy();
      animation = null;
    }

    $("#lottieContainer")
      .removeClass("opacity-100 scale-100")
      .addClass("opacity-0 scale-75");
  }

  $(".close-btn").on("click", closeModal);

  $(".overlay-modal").on("click", function(e){
    if($(e.target).hasClass("overlay-modal")){
      closeModal();
    }
  });

});
</script>
