    <style>
       /* svg path {
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
} */

/* Remove the old keyframe definitions that start instantly */
@keyframes dotPulse {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}

/* We'll activate this class later using JS */
.animate-dots .line1,
.animate-dots .dot1,
.animate-dots .line2,
.animate-dots .dot2,
.animate-dots .line3,
.animate-dots .dot3 {
  animation: dotPulse 1.2s ease-in-out infinite;
}

/* Stagger delay between each group (1 → 2 → 3) */
.animate-dots .line2,
.animate-dots .dot2 {
  animation-delay: 0.4s;
}
.animate-dots .line3,
.animate-dots .dot3 {
  animation-delay: 0.8s;
}

/* Optional rotation for your circle */
.circle {
  transform-box: fill-box;
  transform-origin: center center;
  animation: circle-rotate 5s linear infinite;
}
@keyframes circle-rotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

    </style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const tl = gsap.timeline({ defaults: { ease: "power2.inOut" } });
  // 1️⃣ Cloud fill
  tl.from(".cloud-fill", { fillOpacity: 0, duration: 1.5 });
  // 2️⃣ Green circle fill
  tl.from(".green-circle", { scale: 0, transformOrigin: "50% 50%", duration: 1.2 }, "-=0.5");
  // 3️⃣ Cloud outline
  document.querySelectorAll(".cloud-outline").forEach(path => {
    const length = path.getTotalLength();
    path.style.strokeDasharray = length;
    path.style.strokeDashoffset = length;
  });
  tl.to(".cloud-outline", { strokeDashoffset: 0, duration: 1.5 });
  // 4️⃣ Browser outline
  document.querySelectorAll(".browse").forEach(path => {
    const length = path.getTotalLength();
    path.style.strokeDasharray = length;
    path.style.strokeDashoffset = length;
  });
  tl.to(".browse", { strokeDashoffset: 0, duration: 1.5 });
  // 5️⃣ Elements inside green circle (.circle) appear & rotate
  tl.fromTo(".circle",
    { autoAlpha: 0,  },
    { autoAlpha: 1,}
  );
 // 6️⃣ Boxes inside browser
  tl.from(".box1", { scale: 0, transformOrigin: "center center", duration: 0.5 });
  tl.from(".box2", { scale: 0, transformOrigin: "center center", duration: 0.5 }, "-=0.3");
  // 7️⃣ Leaf fill
  tl.from(".leaf-fill", { fillOpacity: 0, duration: 1 });
  // 8️⃣ Leaf outline
  document.querySelectorAll(".leaf-outline").forEach(path => {
    const length = path.getTotalLength();
    path.style.strokeDasharray = length;
    path.style.strokeDashoffset = length;
  });
  tl.to(".leaf-outline", { strokeDashoffset: 0, duration: 1 });
});
</script>
