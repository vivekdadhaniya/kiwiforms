    <style>
        .bar1 {
            animation: bar1Anim 4s infinite ease-in-out;
            transform-origin: center;
        }

        .bar2 {
            animation: bar2Anim 4s infinite ease-in-out;
            transform-origin: center;
        }

        @keyframes bar1Anim {

            /* Initial */
            0% {
                fill: #FEFFA4;
                transform: translate(0, 0);
                opacity: 1;
            }

            /* Color change */
            29.5% {
                fill: #B8DD2F;
                transform: translate(0, 0);
            }

            /* Switch position */
            70% {
                transform: translate(-17px, 15px);
                opacity: 1;
            }

            /* Fade out */
            75% {
                opacity: 0;
            }

            /* Reset */
            100% {
                fill: #FEFFA4;
                transform: translate(0, 0);
                opacity: 0;
            }
        }

        @keyframes bar2Anim {

            /* Initial */
            0% {
                fill: #FEFFA4;
                transform: translate(0, 0);
                opacity: 1;
            }

            /* Color change */
            29.5% {
                fill: #B8DD2F;
                transform: translate(0, 0);
            }

            /* Switch position */
            70% {
                transform: translate(17px, -15px);
                opacity: 1;
            }

            /* Fade out */
            75% {
                opacity: 0;
            }

            /* Reset */
            100% {
                fill: #FEFFA4;
                transform: translate(0, 0);
                opacity: 0;
            }
        }
    </style>
    <style>
        .switch1 {
            animation: triSwitch1 4s infinite ease-in-out;
            transform-origin: center;
        }

        .switch2 {
            animation: triSwitch2 4s infinite ease-in-out;
            transform-origin: center;
        }

        @keyframes triSwitch1 {
            0% {
                fill: #FEFFA4;
                transform: translate(0, 0);
                opacity: 1;
            }

            /* Color change */
            15% {
                fill: #B8DD2F;
                transform: translate(0, 0);
            }

            /* Triangle movement */
            40% {
                transform: translate(16px, 26px);
                opacity: 1;
            }

            70% {
                transform: translate(-16px, 26px);
                opacity: 1;
            }

            /* Reset */
            97% {
                fill: #B8DD2F;
                transform: translate(0, 0);
                opacity: 1;
            }

            100% {
                fill: #FEFFA4;

            }
        }
    </style>
    <style>
        .mainFill {
            animation: fillAnim 2s infinite ease-in-out;
        }

        .curve {
            opacity: 0;
            animation: curveAnim 2s infinite ease-in-out;
        }

        /* Yellow Fill Animation */
        @keyframes fillAnim {
            0% {
                fill: #FEFFA4;
            }

            25% {
                fill: #B8DD2F;
            }

            100% {
                fill: #B8DD2F;
            }
        }

        /* Curve Visibility Animation */
        @keyframes curveAnim {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 0;
            }

            51% {
                opacity: 1;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
    <style>
        .scrollFill {
            animation: fillAnim 2s infinite ease-in-out;
        }

        .curve {
            opacity: 0;
            animation: curveAnim 2s infinite ease-in-out;
        }

        /* Color animation */
        @keyframes fillAnim {
            0% {
                fill: #FEFFA4;
            }

            25% {
                fill: #B8DD2F;
            }

            100% {
                fill: #B8DD2F;
            }
        }

        /* Curve reveal */
        @keyframes curveAnim {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 0;
            }

            75% {
                opacity: 1;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

    <!-- badge input  -->
    <script>
        // Select all tag wrappers
        document.querySelectorAll('.tag-input-wrapper').forEach(wrapper => {
            const input = wrapper.querySelector('.tag-input');
            const defaultTag = wrapper.dataset.default || ''; // get default tag from HTML
            let tags = defaultTag ? [defaultTag] : [];

            // Render tags
            function renderTags() {
                wrapper.querySelectorAll('.tag').forEach(tag => tag.remove());

                tags.forEach(tagText => {
                    const tagEl = document.createElement('div');
                    tagEl.className =
                        'tag flex items-center gap-1 px-2 py-1 bg-white border border-gray-200 rounded-full text-sm text-green-700 font-medium';
                    tagEl.innerHTML = `
            <span>${tagText}</span>
            <button type="button" class="text-gray-500 hover:text-gray-700 focus:outline-none" data-tag="${tagText}">&times;</button>
          `;
                    wrapper.insertBefore(tagEl, input);
                });

                // Hide input if 1 tag added
                input.style.display = tags.length >= 1 ? 'none' : 'block';
            }

            // Add tag
            function addTag(value) {
                const trimmed = value.trim();
                if (trimmed) {
                    tags = [trimmed];
                    renderTags();
                }
                input.value = '';
            }

            // Remove tag
            function removeTag(tagText) {
                tags = tags.filter(t => t !== tagText);
                renderTags();
            }

            // Events
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addTag(input.value);
                }
            });

            input.addEventListener('blur', () => {
                addTag(input.value);
            });

            wrapper.addEventListener('click', e => {
                if (e.target.matches('button[data-tag]')) {
                    removeTag(e.target.dataset.tag);
                }
            });

            // Initialize default
            renderTags();
        });
    </script>

    <!-- SCRIPT 2: Input + Increment/Decrement Logic (Multi-instance safe) -->
    <script>
        document.querySelectorAll('.field-group').forEach(group => {
            const input = group.querySelector('.custom-input');
            const incrementBtn = group.querySelector('.increment-btn');
            const decrementBtn = group.querySelector('.decrement-btn');
            const numberControls = group.querySelector('.number-controls');
            const dropdown = group.querySelector('.custom-dropdown[data-style="design1"]');
            const dropdownButton = dropdown.querySelector('.dropdown-button');

            // Toggle arrow visibility
            function toggleNumberControls(type) {
                if (type === 'number') {
                    numberControls.classList.remove('hidden');
                } else {
                    numberControls.classList.add('hidden');
                }
            }

            toggleNumberControls(input.type);

            incrementBtn.addEventListener('click', () => input.stepUp());
            decrementBtn.addEventListener('click', () => input.stepDown());

            dropdownButton.addEventListener('optionSelected', e => {
                const selectedText = e.detail.toLowerCase();
                if (selectedText === 'number') {
                    input.type = 'number';
                    input.placeholder = 'Enter a number';
                } else if (selectedText === 'text') {
                    input.type = 'text';
                    input.placeholder = 'Enter text';
                }
                toggleNumberControls(input.type);
            });
        });
    </script>

    <!-- data pull modal editiable div  -->
    <script>
        document.querySelectorAll(".editableDiv").forEach((editableDiv) => {
            const popup = editableDiv.parentElement.querySelector(".popup");
            let slashRange = null;

            // ===== Show popup on "/" =====
            editableDiv.addEventListener("keyup", (e) => {
                if (e.key === "/") {
                    const rect = getCaretCoordinates();
                    const parentRect = editableDiv.getBoundingClientRect();
                    popup.style.left = rect.left - parentRect.left + "px";
                    popup.style.top = rect.top - parentRect.top + 20 + "px";
                    popup.classList.remove("hidden");
                    saveCaret();
                } else if (e.key === "Escape") {
                    popup.classList.add("hidden");
                }
            });

            // ===== Hide popup when clicking outside =====
            document.addEventListener("click", (e) => {
                if (!popup.contains(e.target) && e.target !== editableDiv) {
                    popup.classList.add("hidden");
                }
            });

            // ===== Handle popup item clicks =====
            popup.addEventListener("click", (e) => {
                const popupItem = e.target.closest("[data-value]");
                if (popupItem && popupItem.dataset.value) {
                    restoreCaret();
                    insertBadge(popupItem.dataset.value);
                    popup.classList.add("hidden");
                }
            });

            // ===== Save caret =====
            function saveCaret() {
                const sel = window.getSelection();
                if (sel.rangeCount > 0) slashRange = sel.getRangeAt(0);
            }

            // ===== Restore caret =====
            function restoreCaret() {
                if (slashRange) {
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(slashRange);
                }
            }

            // ===== Insert badge =====
            function insertBadge(text) {
                const sel = window.getSelection();
                if (!sel.rangeCount) return;
                let range = sel.getRangeAt(0);

                try {
                    range.setStart(range.startContainer, range.startOffset - 1);
                    range.deleteContents();
                } catch { }

                const badge = document.createElement("span");
                badge.className = "badge";
                badge.contentEditable = "false";

                const textNode = document.createElement("span");
                textNode.textContent = text;

                const crossBtn = document.createElement("span");
                crossBtn.className = "remove";
                crossBtn.innerHTML = "×";

                badge.appendChild(textNode);
                badge.appendChild(crossBtn);

                const space = document.createTextNode("\u200B");
                range.insertNode(space);
                range.insertNode(badge);

                range.setStartAfter(space);
                range.setEndAfter(space);
                sel.removeAllRanges();
                sel.addRange(range);

                updatePlaceholder();
            }

            // ===== Remove badge on × click =====
            editableDiv.addEventListener("click", (e) => {
                if (e.target.classList.contains("remove")) {
                    e.preventDefault();
                    e.target.parentElement.remove();
                    cleanEmptyNodes(editableDiv); // <-- remove invisible chars
                    placeCaretAtEnd(editableDiv);
                    updatePlaceholder(); // re-check placeholder state
                }
            });

            // ===== Placeholder logic =====
            function updatePlaceholder() {
                const text = editableDiv.textContent.replace(/\u200B/g, "").trim();
                if (text === "") {
                    editableDiv.classList.add("empty");
                } else {
                    editableDiv.classList.remove("empty");
                }
            }

            editableDiv.addEventListener("input", () => {
                cleanEmptyNodes(editableDiv);
                updatePlaceholder();
            });

            // Initial state check
            cleanEmptyNodes(editableDiv);
            updatePlaceholder();
        });

        // ===== Shared helpers =====
        function getCaretCoordinates() {
            const sel = window.getSelection();
            if (sel.rangeCount === 0) return { left: 0, top: 0 };
            const range = sel.getRangeAt(0).cloneRange();
            range.collapse(true);
            const rect = range.getBoundingClientRect();
            return { left: rect.left, top: rect.top };
        }

        function placeCaretAtEnd(el) {
            el.focus();
            const range = document.createRange();
            range.selectNodeContents(el);
            range.collapse(false);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }

        // 🧹 Clean hidden zero-width spaces or empty nodes
        function cleanEmptyNodes(el) {
            el.childNodes.forEach((node) => {
                if (
                    (node.nodeType === Node.TEXT_NODE &&
                        node.textContent.replace(/\u200B/g, "").trim() === "") ||
                    (node.nodeType === Node.ELEMENT_NODE && node.innerHTML.trim() === "")
                ) {
                    node.remove();
                }
            });
        }
    </script>
