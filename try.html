<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Select Dropdown</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex flex-col items-center justify-center min-h-screen gap-20 bg-gray-50">

    <!-- DESIGN 1 -->
    <div class="custom-dropdown relative w-80">
        <p class="font-medium">Design 1</p>
        <div class="relative mt-6">
            <button type="button"
                class="dropdown-button w-full flex justify-between items-center bg-[#EDE9E9] text-[#8C8484] px-4 py-3.5 rounded-[10px] text-base font-normal leading-[140%] transition-all">
                <span class="selected-option">Select your primary reason for using Kiwiform</span>
                <svg class="dropdown-arrow w-4 h-4 ml-2 transition-transform duration-200" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </button>

            <div
                class="dropdown-menu hidden absolute w-full bg-white border border-[#E9E1E1] rounded-[10px] shadow p-1.5 mt-2 text-[15px] leading-[120%] text-gray-700 z-10">
                <ul class="dropdown-list flex flex-col w-full bg-[#F8F6F6]">
                    <li
                        class="dropdown-item p-[15px] hover:bg-[#F8F6F6] cursor-pointer flex justify-between items-center">
                        <span>For Work</span>
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"
                            class="hidden">
                            <rect width="18" height="18" rx="9" fill="#007D47" />
                            <path d="M5.25 8.71875L7.75 11.2188L12.75 6.21875" stroke="white" stroke-width="1.2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </li>
                    <li
                        class="dropdown-item p-[15px] hover:bg-[#F8F6F6] cursor-pointer flex justify-between items-center">
                        <span>For School</span>
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"
                            class="hidden">
                            <rect width="18" height="18" rx="9" fill="#007D47" />
                            <path d="M5.25 8.71875L7.75 11.2188L12.75 6.21875" stroke="white" stroke-width="1.2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </li>
                    <li
                        class="dropdown-item p-[15px] hover:bg-[#F8F6F6] cursor-pointer flex justify-between items-center">
                        <span>For Personal Projects</span>
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"
                            class="hidden">
                            <rect width="18" height="18" rx="9" fill="#007D47" />
                            <path d="M5.25 8.71875L7.75 11.2188L12.75 6.21875" stroke="white" stroke-width="1.2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- DESIGN 2 -->
    <div class="custom-dropdown relative w-80">
        <p class="font-medium">Design 2</p>
        <div class="relative w-full">
            <label class="text-[15px] leading-[120%] text-[#8C8484]">Always go to</label>
            <button type="button"
                class="dropdown-button w-full mt-[5px] flex justify-between items-center border border-[#E2DCDC] bg-[#F8F6F6] rounded-[10px] px-[15px] py-2.5 transition-all hover:bg-white focus:outline-none">
                <div
                    class="selected-option flex items-center gap-[15px] text-[#8C8484] text-[15px] leading-[120%] font-medium">
                    Select...
                </div>
                <svg class="dropdown-arrow w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
            </button>

            <div
                class="dropdown-menu hidden absolute p-[5px] z-10 mt-[5px] w-full bg-white border border-gray-200 rounded-[10px] shadow-soft">

                <!-- Search box -->
                <div class="relative mb-1">
                    <svg class="absolute top-2.5 left-2.5" width="20" height="20" viewBox="0 0 20 20" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M9.34375 15.6875C12.8473 15.6875 15.6875 12.8473 15.6875 9.34375C15.6875 5.84019 12.8473 3 9.34375 3C5.84019 3 3 5.84019 3 9.34375C3 12.8473 5.84019 15.6875 9.34375 15.6875Z"
                            stroke="#8C8484" stroke-width="1.2" />
                        <path d="M17 17L15.25 15.25" stroke="#8C8484" stroke-width="1.2" />
                    </svg>
                    <input type="text" placeholder="Search..."
                        class="dropdown-search w-full p-2.5 pl-10 rounded-[10px] focus:outline-none bg-[#EDE9E9] placeholder:text-[#8C8484] text-sm leading-[140%] text-black">
                </div>

                <ul class="dropdown-list max-h-48 overflow-y-auto text-sm">
                    <li
                        class="dropdown-item flex items-center gap-[15px] p-[15px] cursor-pointer border-b border-[#E2DCDC]">
                        <span
                            class="w-5 aspect-square rounded-full flex items-center justify-center bg-[#E8E1E1] text-xs font-semibold">1</span>
                        <p>Full Name</p>
                    </li>
                    <li
                        class="dropdown-item flex items-center gap-[15px] p-[15px] cursor-pointer border-b border-[#E2DCDC]">
                        <span
                            class="w-5 aspect-square rounded-full flex items-center justify-center bg-[#E8E1E1] text-xs font-semibold">2</span>
                        <p>Email Address</p>
                    </li>
                    <li class="dropdown-item flex items-center gap-[15px] p-[15px] cursor-pointer">
                        <span
                            class="w-5 aspect-square rounded-full flex items-center justify-center bg-[#E8E1E1] text-xs font-semibold">3</span>
                        <p>Phone Number</p>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- ✅ Unified Script -->
    <script>
        document.querySelectorAll('.custom-dropdown').forEach(dropdown => {
            const button = dropdown.querySelector('.dropdown-button');
            const menu = dropdown.querySelector('.dropdown-menu');
            const arrow = dropdown.querySelector('.dropdown-arrow');
            const selected = dropdown.querySelector('.selected-option');
            const items = dropdown.querySelectorAll('.dropdown-item');
            const search = dropdown.querySelector('.dropdown-search');

            // Toggle dropdown
            button.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.dropdown-menu').forEach(m => m !== menu && m.classList.add('hidden'));
                menu.classList.toggle('hidden');
                arrow?.classList.toggle('rotate-180');
            });

            // Select an item
            items.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selected.innerHTML = item.innerHTML; // works for both text or rich HTML
                    menu.classList.add('hidden');
                    arrow?.classList.remove('rotate-180');
                });
            });

            // Filter via search input
            if (search) {
                search.addEventListener('input', () => {
                    const query = search.value.toLowerCase();
                    items.forEach(item => {
                        const match = item.textContent.toLowerCase().includes(query);
                        item.style.display = match ? 'flex' : 'none';
                    });
                });
            }
        });

        // Close when clicking outside
        window.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.add('hidden'));
            document.querySelectorAll('.dropdown-arrow').forEach(a => a.classList.remove('rotate-180'));
        });
    </script>
</body>

</html>
