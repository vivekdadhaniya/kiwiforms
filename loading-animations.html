<!doctype html>
<html lang="en">
  <head>
    <!-- REQUIRED META TAGS -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Kiwiform/share</title>
    <!--- MAIN CSS ---->
    <link rel="stylesheet" href="assets/css/input.css" />
    <link rel="stylesheet" href="assets/css/output.css" />
    <link rel="stylesheet" href="node_modules/leaflet/dist/leaflet.css" />
    <style>
      .h-with-toast {
        height: calc(100% - 112px) !important;
        /* adjust value as needed */
      }

      .progress-loader {
        position: relative;
        width: 200px;
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        border: 0.3px solid #ffffffc2;
      }

      .progress-loader span {
        position: absolute;
        top: 2px;
        left: 0;
        width: 38%;
        height: 4px;
        border-radius: inherit;
        background: #fff;
        animation: progressMove 2.4s ease-in-out infinite;
      }

      @keyframes progressMove {
        0% {
          transform: translateX(-100%);
        }

        100% {
          transform: translateX(270%);
        }
      }
    </style>
  </head>

  <body class="bg-Theme-bg font-Inter">
    <div class="flex flex-col max-md:gap-8 md:flex-row">
      <!--Header--->

      <div class="w-full h-screen pt-[61px]">
        <div
          class="w-full h-full flex flex-col items-center justify-center gap-10 bg-Theme-Forground rounded-10px"
        >
          <div class="py-8 px-4 bg-Theme-Black">
            <div class="progress-loader bg-transparent flex items-center">
              <span class=""></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    ></script>
    <script src="assets/js/main.js"></script>
    <link
