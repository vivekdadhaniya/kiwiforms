<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Then Condition</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex flex-col items-center justify-center h-screen bg-gray-50 p-4">

  <!-- Dropdown -->
  <div class="custom-dropdown relative w-full max-w-[150px]" id="actionDropdown">
    <div class="relative">
      <button type="button"
        class="dropdown-button w-full flex justify-between items-center bg-[#F8F6F6] border border-[#E2DCDC] text-[#8C8484] p-2.5 pl-[15px] rounded-[10px] text-[15px] font-normal leading-[18px] focus:outline-none transition-all">
        <span class="selected-option">Go to</span>
        <svg class="dropdown-arrow w-4 h-4 ml-2 transition-transform duration-200" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <div
        class="dropdown-menu absolute hidden w-full bg-white border border-[#E9E1E1] rounded-[10px] shadow-strong p-1.5 mt-2 text-[15px] leading-120 text-gray-700 overflow-hidden z-10">
        <ul class="dropdown-list flex flex-col w-full bg-[#F8F6F6]">
          <li class="dropdown-item p-2.5 hover:bg-[#F8F6F6] rounded-[5px] cursor-pointer" data-value="Go to">Go to</li>
          <li class="dropdown-item p-2.5 hover:bg-[#F8F6F6] rounded-[5px] cursor-pointer" data-value="Add">Add</li>
          <li class="dropdown-item p-2.5 hover:bg-[#F8F6F6] rounded-[5px] cursor-pointer" data-value="Subtract">Subtract
          </li>
          <li class="dropdown-item p-2.5 hover:bg-[#F8F6F6] rounded-[5px] cursor-pointer" data-value="Multiply">Multiply
          </li>
          <li class="dropdown-item p-2.5 hover:bg-[#F8F6F6] rounded-[5px] cursor-pointer" data-value="Divide">Divide
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Rule Section -->
  <div id="ruleSection" class="hidden mt-5 w-full max-w-2xl">
    <div class="border border-[#E2DCDC] rounded-[10px] bg-white shadow-sm p-4">
      <div class="flex items-center gap-3 mb-3">
        <span class="text-gray-600 font-medium">If</span>
        <select
          class="border border-gray-300 rounded-[8px] px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
          <option>Select condition</option>
          <option>A = 4</option>
          <option>B = 2</option>
          <option>C = 8</option>
        </select>
        <span class="text-gray-600 font-medium">is</span>
        <input type="text"
          class="border border-gray-300 rounded-[8px] px-2.5 py-1.5 text-sm focus:outline-none w-32 focus:ring-2 focus:ring-green-500"
          placeholder="Enter value" />
      </div>

      <div class="flex items-center gap-3">
        <span class="text-gray-600 font-medium">Then</span>

        <!-- First Select (Main Action) -->
        <select id="thenAction"
          class="border border-gray-300 rounded-[8px] px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
          <option value="">Select action</option>
          <option value="Add">Add</option>
          <option value="Subtract">Subtract</option>
          <option value="Multiply">Multiply</option>
          <option value="Divide">Divide</option>
        </select>

        <!-- Second Select -->
        <select id="thenSecond"
          class="border border-gray-300 rounded-[8px] px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
          <option value="">Select value</option>
        </select>

        <!-- Third Select (Dynamic) -->
        <select id="thenThird"
          class="border border-gray-300 rounded-[8px] px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 hidden">
        </select>
      </div>
    </div>
  </div>

  <script>
    const dropdownBtn = document.querySelector('.dropdown-button');
    const dropdownMenu = document.querySelector('.dropdown-menu');
    const selectedOption = document.querySelector('.selected-option');
    const ruleSection = document.getElementById('ruleSection');

    const thenAction = document.getElementById('thenAction');
    const thenSecond = document.getElementById('thenSecond');
    const thenThird = document.getElementById('thenThird');

    // Show/hide main rule section
    dropdownBtn.addEventListener('click', () => {
      dropdownMenu.classList.toggle('hidden');
    });

    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        const value = item.dataset.value;
        selectedOption.textContent = value;
        dropdownMenu.classList.add('hidden');

        if (['Add', 'Subtract', 'Multiply', 'Divide'].includes(value)) {
          ruleSection.classList.remove('hidden');
          gsap.fromTo(ruleSection, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 });
        } else {
          gsap.to(ruleSection, { opacity: 0, y: -10, duration: 0.2, onComplete: () => ruleSection.classList.add('hidden') });
        }
      });
    });

    // Dynamic logic for THEN selects
    const optionsMap = {
      Add: ['2', '4', '8'],
      Subtract: ['1', '3', '6'],
      Multiply: ['2x', '3x', '4x'],
      Divide: ['2', '4', '8']
    };

    const thirdOptionsMap = {
      Add: ['To A', 'To B', 'To C'],
      Subtract: ['From A', 'From B', 'From C'],
      Multiply: ['By A', 'By B', 'By C'],
      Divide: ['By A', 'By B', 'By C']
    };

    thenAction.addEventListener('change', () => {
      const selected = thenAction.value;

      // Update second select
      thenSecond.innerHTML = '<option value="">Select value</option>';
      if (optionsMap[selected]) {
        optionsMap[selected].forEach(v => {
          const opt = document.createElement('option');
          opt.textContent = v;
          thenSecond.appendChild(opt);
        });
      }

      // Hide third until second is chosen
      thenThird.classList.add('hidden');
    });

    thenSecond.addEventListener('change', () => {
      const action = thenAction.value;
      const value = thenSecond.value;

      if (action && value) {
        // Show third select
        thenThird.classList.remove('hidden');
        thenThird.innerHTML = '<option value="">Select target</option>';

        if (thirdOptionsMap[action]) {
          thirdOptionsMap[action].forEach(v => {
            const opt = document.createElement('option');
            opt.textContent = v;
            thenThird.appendChild(opt);
          });
        }
      }
    });

    document.addEventListener('click', (e) => {
      if (!dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.add('hidden');
      }
    });
  </script>

</body>

</html>
